# Caminho real no repositório: .github/workflows/ci.yml
#
# Além do piso mínimo original (dependências instalam, os dois arquivos
# Python compilam, o lint não acusa nada), este workflow agora roda a suíte
# de testes em tests/: unitários (somar, executar_ferramenta,
# carregar_contexto), de contrato (FERRAMENTAS bate com o código) e run-level
# (responder() completo, com o cliente da OpenAI trocado por um dublê — sem
# gastar chamada real).
#
# O que NÃO roda aqui: tests/test_smoke.py, marcado `smoke`, que chama a API
# de verdade. Ele custa dinheiro e não é 100% determinístico — não pertence
# ao gate de todo PR. Roda manualmente ou num job separado, com
# `pytest -m smoke` e OPENAI_API_KEY configurada.

name: CI

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Checar sintaxe (py_compile)
        run: python -m py_compile agent.py app.py

      - name: Lint (ruff)
        run: |
          pip install ruff
          ruff check agent.py app.py

      - name: Testes (unitários + contrato + run-level, sem API real)
        run: pytest -m "not smoke" -v
