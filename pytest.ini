[pytest]
markers =
    smoke: chama a API real da OpenAI (custa e não é 100% determinístico). Roda só com `pytest -m smoke` e OPENAI_API_KEY configurada — não tem marker positivo (unitario/contrato/run_level), então já fica de fora dos jobs do CI por construção.
    unitario: testes unitários — funções puras, sem rede (somar, executar_ferramenta, carregar_contexto).
    contrato: garante que FERRAMENTAS (o que o modelo lê) bate com o código Python de verdade.
    run_level: testa o loop responder() completo, com o cliente da OpenAI trocado por um dublê.
    eval: eval de persona — chama a API real da OpenAI com cada perfil (agent-ada.md, agent-lint.md, agent-val.md) e checa se a resposta respeita as regras daquele perfil (heurística, não LLM-as-judge). Custa e não é 100% determinístico. Roda só com `pytest -m eval` e OPENAI_API_KEY configurada — não tem marker positivo (unitario/contrato/run_level), então já fica de fora dos jobs do CI por construção.
