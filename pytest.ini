[pytest]
markers =
    smoke: chama a API real da OpenAI (custa e não é 100% determinístico). Roda só com `pytest -m smoke` e OPENAI_API_KEY configurada — fora disso, fica de fora do `pytest -m "not smoke"` usado no CI.
    unitario: testes unitários — funções puras, sem rede (somar, executar_ferramenta, carregar_contexto).
    contrato: garante que FERRAMENTAS (o que o modelo lê) bate com o código Python de verdade.
    run_level: testa o loop responder() completo, com o cliente da OpenAI trocado por um dublê.
